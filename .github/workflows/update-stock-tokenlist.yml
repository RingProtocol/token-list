name: Update stock token list

on:
  workflow_dispatch:
  schedule:
    # Runs every day at 08:00 UTC / 16:00 Asia/Shanghai.
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-stock-tokenlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate stock token list
        env:
          ENSO_API_KEY: ${{ secrets.ENSO_API_KEY }}
          BINANCE_WEB3_API_KEY: ${{ secrets.BINANCE_WEB3_API_KEY }}
          BINANCE_WEB3_API_SECRET: ${{ secrets.BINANCE_WEB3_API_SECRET }}
          BITGET_WEB3_API_KEY: ${{ secrets.BITGET_WEB3_API_KEY }}
          BITGET_WEB3_API_SECRET: ${{ secrets.BITGET_WEB3_API_SECRET }}
        run: yarn generate:stock-tokenlist

      - name: Validate generated token list
        run: |
          node -e "const list = require('./stock.tokenlist.json'); if (!Array.isArray(list.tokens)) throw new Error('stock.tokenlist.json must contain a tokens array'); console.log('Validated', list.tokens.length, 'stock tokens.');"

      - name: Commit updated stock token list
        run: |
          if [ -z "$(git status --porcelain -- stock.tokenlist.json assets/stock)" ]; then
            echo "No stock token list changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock.tokenlist.json assets/stock
          git commit -m "chore: update stock token list"
          git push
