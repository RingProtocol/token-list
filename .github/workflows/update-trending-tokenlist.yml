name: Update trending token list

on:
  workflow_dispatch:
  schedule:
    # Runs every hour
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate trending token list
        run: node generateTrendingTokenList.js

      - name: Commit updated trending token list
        run: |
          if git diff --quiet -- trending.tokenlist.json; then
            echo "No trending token list changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trending.tokenlist.json
          git commit -m "chore: update trending token list"
          git push
